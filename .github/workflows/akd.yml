name: AKD

on:
  push:
    branches: [feat/akd]   # TEMPORARY: branch testing, always a dry run. Remove before merging.
  schedule:
    - cron: "30 13 * * *"   # daily, 13:30 UTC (runs only from the default branch)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write to out/ and upload as an artifact, push nothing"
        type: boolean
        default: true

concurrency:
  group: akd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  akd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Real publishing only for the schedule, or a manual dispatch with dry_run unchecked.
      DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the site repo
        uses: actions/checkout@v4
        with:
          repository: kedar-bhumkar/ai-arch-showcase
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Run AKD
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m akd.cli run --dry-run
          else
            python -m akd.cli run
          fi

      - name: Upload dry-run output
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akd-dry-run
          path: out/
          if-no-files-found: ignore

      - name: Publish digest (this repo)
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whats-new.md
          if git diff --cached --quiet; then echo "no digest change"; exit 0; fi
          git commit -m "AKD digest $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish items.json (site repo)
        if: env.DRY_RUN != 'true'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/whats-new/items.json
          if git diff --cached --quiet; then echo "no site change"; exit 0; fi
          git commit -m "What's New $(date -u +%F)"
          git pull --rebase
          git push
