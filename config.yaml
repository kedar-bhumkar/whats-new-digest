# AKD configuration. Weights are applied in code; changing them never re-runs inference.
weights:
  significance: 0.45
  relevance: 0.25
  actionability: 0.20
  novelty: 0.10
max_picks: 5
max_notable: 10
min_notable_rank: 0.35
hype_penalty: 0.5
low_confidence_threshold: 0.4
window_days: 60

subreddits:
  - LocalLLaMA
  - ClaudeAI
  - MachineLearning
  - programming

feeds:
  - https://www.anthropic.com/news/rss.xml
  - https://openai.com/news/rss.xml
  - https://hnrss.org/newest?q=LLM+OR+Claude+OR+agents&points=100

github_topics:
  - llm
  - ai-agents
  - mcp
  - claude-code

github_watchlist:
  - anthropics/claude-code
  - anthropics/anthropic-sdk-python
  - modelcontextprotocol/servers
